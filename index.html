    // Thuật toán xáo trộn (Fisher-Yates Shuffle)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // 1. Xáo trộn ngẫu nhiên vị trí các câu hỏi
    shuffle(quizData);

    // 2. Xáo trộn ngẫu nhiên các đáp án bên trong mỗi câu
    quizData.forEach(item => {
        let correctText = item.opts[item.ans];
        shuffle(item.opts);
        item.ans = item.opts.indexOf(correctText);
    });

    const container = document.getElementById('quiz-container');
    
    // Render câu hỏi ra giao diện
    quizData.forEach((item, index) => {
        let optionsHTML = '';
        item.opts.forEach((opt, oIndex) => {
            // Cắt bỏ ký tự đánh dấu A, B, C, D cứng từ chuỗi gốc và đặt lại theo thứ tự mới
            let cleanOpt = opt.replace(/^[A-D]\.\s*/, '');
            let newPrefix = String.fromCharCode(65 + oIndex); 
            
            optionsHTML += `
                <label class="option-label" id="label-${index}-${oIndex}">
                    <input type="radio" name="q${index}" value="${oIndex}">
                    ${newPrefix}. ${cleanOpt}
                </label>
            `;
        });

        const card = document.createElement('div');
        card.className = 'question-card';
        card.innerHTML = `
            <div class="question-title">Câu ${index + 1}: ${item.q}</div>
            <div class="options">${optionsHTML}</div>
        `;
        container.appendChild(card);
    });

    // Xử lý nộp bài
    function checkAnswers() {
        let score = 0;
        quizData.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const correctIndex = item.ans;
            
            // Khóa lựa chọn sau khi nộp
            document.querySelectorAll(`input[name="q${index}"]`).forEach(input => input.disabled = true);

            for(let i=0; i < item.opts.length; i++) {
                document.getElementById(`label-${index}-${i}`).classList.remove('correct-ans', 'wrong-ans');
            }

            // Hiển thị kết quả đúng
            document.getElementById(`label-${index}-${correctIndex}`).classList.add('correct-ans');

            if (selected) {
                const userIndex = parseInt(selected.value);
                if (userIndex === correctIndex) {
                    score++;
                } else {
                    document.getElementById(`label-${index}-${userIndex}`).classList.add('wrong-ans');
                }
            }
        });

        const resDiv = document.getElementById('result');
        resDiv.style.display = 'block';
        resDiv.innerHTML = `Cậu chủ đã trả lời đúng ${score} / ${quizData.length} câu!`;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>
